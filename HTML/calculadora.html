<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <!-- Metadados: não aparecem na tela -->
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styleCal.css" />
    <title>Calculadora</title>
  </head>

  <body>
    <div class="corpoCal">
        <div class="telaCal"></div>

        <div class="linha">
           <div class="botao">+</div>
           <div class="botao">-</div>
           <div class="botao">%</div>
           <div class="botao">X</div>
        </div>

         <div class="linha">
           <div class="botao">9</div>
           <div class="botao">8</div>
           <div class="botao">7</div>
           <div class="botao">C</div>
        </div>

        <div class="linha">
           <div class="botao">6</div>
           <div class="botao">5</div>
           <div class="botao">4</div>
           <div class="botao">.</div>
        </div>

        <div class="linha">
           <div class="botao">3</div>
           <div class="botao">2</div>
           <div class="botao">1</div>
           <div class="botao">=</div>
        </div>

        <div class="linha">
           <div class="botao"> </div>
           <div class="botao">0</div>
           <div class="botao"> </div>
           <div class="botao"> </div>
        </div>

    </div>

</html>
